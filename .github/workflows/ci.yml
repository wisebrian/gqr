name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # The oldest version go.mod allows, and the latest.
        go: ["1.23", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
